<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salt &amp; Neon — Palmera Bay</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="viewport"></div>

<!-- In-game HUD -->
<div id="hud" class="hidden">
  <div id="hud-top-right">
    <div id="hud-clock">17:30</div>
    <div id="hud-weapon"><span id="hud-weapon-name">Fists</span><span id="hud-ammo"></span></div>
    <div id="hud-money">$0</div>
    <div id="hud-wanted"></div>
  </div>
  <div id="hud-objective" class="hidden"></div>
  <div id="hud-help" class="hidden"></div>
  <div id="hud-minimap-wrap">
    <canvas id="hud-minimap" width="220" height="220"></canvas>
    <div id="hud-bars"><div class="bar"><div id="hud-health"></div></div><div class="bar armor"><div id="hud-armor"></div></div></div>
    <div id="hud-location"></div>
  </div>
  <div id="hud-vehicle" class="hidden"><div id="hud-vehicle-name"></div><div id="hud-speed">0</div><div id="hud-radio"></div></div>
  <div id="hud-crosshair" class="hidden"></div>
  <div id="hud-hitmarker"></div>
  <div id="hud-subtitle" class="hidden"></div>
  <div id="hud-timer" class="hidden"></div>
  <div id="hud-damage"></div>
  <div id="hud-banner" class="hidden"><div id="hud-banner-title"></div><div id="hud-banner-sub"></div></div>
</div>

<!-- Title screen -->
<div id="title-screen" class="screen hidden">
  <div class="title-logo">
    <div class="logo-salt">SALT</div><div class="logo-amp">&amp;</div><div class="logo-neon">NEON</div>
    <div class="logo-tag">a Palmera Bay story</div>
  </div>
  <div class="menu" id="title-menu"></div>
  <div class="title-foot">WASD move · Mouse look · F enter/exit car · LMB shoot · Esc pause</div>
</div>

<!-- Pause / map / controls overlays -->
<div id="pause-screen" class="screen hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="menu" id="pause-menu"></div>
    <div id="pause-stats"></div>
  </div>
</div>
<div id="map-screen" class="screen hidden">
  <canvas id="map-canvas" width="900" height="900"></canvas>
  <div id="map-legend"></div>
</div>
<div id="info-screen" class="screen hidden"><div class="panel wide" id="info-body"></div></div>
<div id="fade"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
